    cmake-args: >-
      -DCONFIG_ZMK_DISPLAY=n
      -DCONFIG_ZMK_STUDIO=n
      -DCONFIG_ZMK_RGB_UNDERGLOW=n
      -DCONFIG_WS2812_STRIP=n
    artifact-name: Corne_left_clean
    
  - board: nice_nano_v2
    shield: settings_reset