---
include:
  # PandaKB Corne, using the board's nice!view-compatible display header.
  # Shield order is significant: keyboard -> pin adapter -> display.
  - board: nice_nano_v2
    shield: Corne_L Nice_view_config nice_view_gem
    snippet: studio-rpc-usb-uart
    artifact-name: Corne_left_nice_view
  - board: nice_nano_v2
    shield: Corne_R Nice_view_config nice_view_gem
    artifact-name: Corne_right_nice_view

  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: settings_reset
